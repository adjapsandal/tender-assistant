services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tender_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tender_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: on-failure
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Миграции выносим в отдельный разовый сервис: раньше их запускали
  # и web, и bot одновременно, и два процесса боролись за одну блокировку
  # Alembic на старте.
  migrate:
    build: .
    container_name: tender_migrate
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    container_name: tender_web
    command: uvicorn web_main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    container_name: tender_bot
    command: python main.py
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
